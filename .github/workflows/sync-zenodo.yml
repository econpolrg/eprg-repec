name: Import EPRG papers from Zenodo
# Imports only records matched to the official EPRG numbered series.

on:
  workflow_dispatch:
  schedule:
    # Automatic Zenodo community polling at 00:17, 06:17, 12:17 and 18:17 UTC.
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/import_zenodo.py'
      - 'metadata/abstract_overrides.json'
      - 'scripts/validate_repec.py'
      - 'tests/test_import_zenodo.py'
      - '.github/workflows/sync-zenodo.yml'

permissions:
  contents: write

concurrency:
  group: eprg-repec-zenodo-sync
  cancel-in-progress: false

jobs:
  import-zenodo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Test Zenodo retrieval and abstract selection
        run: python -m unittest discover -s tests -v

      - name: Fetch and convert published Zenodo records
        run: python scripts/import_zenodo.py

      - name: Validate ReDIF metadata and directory references
        run: python scripts/validate_repec.py

      - name: Commit updated ReDIF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RePEc/gvn/eprgwp/
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize EPRG RePEc metadata from Zenodo"
            git push
          else
            echo "No metadata changes"
          fi

      - name: Package metadata site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R RePEc _site/RePEc
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-pages:
    needs: import-zenodo
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy archive metadata to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    steps:
      - name: Check indexable archive and series
        run: |
          set -euo pipefail
          root="https://econpolrg.github.io/eprg-repec/RePEc/gvn"
          for item in "/" "/gvnarch.redif" "/gvnseri.redif" "/eprgwp/" "/eprgwp/2025.redif" "/eprgwp/2026.redif"; do
            printf "Checking %s\n" "$root$item"
            curl --fail --location --silent --show-error --retry 8 --retry-delay 4 --output /dev/null "$root$item"
          done
          echo "All RePEc archive URLs are publicly accessible"

