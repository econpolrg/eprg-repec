name: Inspect official ReDIF syntax checker

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_official_redif.py'
      - '.github/workflows/check-official-redif.yml'
  workflow_dispatch:

jobs:
  inspect-checker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/check_official_redif.py
